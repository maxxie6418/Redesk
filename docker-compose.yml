services:
  redesk:
    build: .
    image: redesk:2.3.0
    container_name: redesk
    restart: unless-stopped
    # 容器以 root 启动，entrypoint 会 chown /data 给 redesk 后再降权运行应用。
    # 若在此处强制 user: '6418:6418'，chown 会失败，命名卷仍归 root 所有。
    ports:
      - '8787:8787'
    volumes:
      - redesk-data:/data
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8787
      - DATABASE_URL=/data/redesk.db
      - STORAGE_DIR=/data/storage
      - SESSION_SECRET=${SESSION_SECRET:?请在环境变量或 .env 中设置强随机 SESSION_SECRET}
      - AUTH_DISABLED=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redesk-data:
