services:
  redesk:
    # 并存模式：有 build 时本地构建并用下方名称命名，适合开发期；
    # 第三方部署可注释掉 build 行，直接拉取 GitHub Packages 发布的镜像。
    build: .
    image: ghcr.io/maxxie6418/redesk:2.6.1
    container_name: redesk
    restart: unless-stopped
    # 容器以 root 启动，entrypoint 会 chown /data 给 redesk 后再降权运行应用。
    # 若在此处强制 user: '6418:6418'，chown 会失败，命名卷仍归 root 所有。
    ports:
      - '8787:8787'
    volumes:
      - redesk-data:/data
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8787
      - DATABASE_URL=/data/redesk.db
      - STORAGE_DIR=/data/storage
      - SESSION_SECRET=${SESSION_SECRET:?请在环境变量或 .env 中设置强随机 SESSION_SECRET}
      - AUTH_DISABLED=false
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # 可选：Agent 接入链接固定的对外地址（如 http://192.168.1.10:8787）。
      # 不设置时回退到请求 Host，本地访问用 http://localhost:8787 即可。
      - REDESK_PUBLIC_URL=${REDESK_PUBLIC_URL:-}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redesk-data:
