services:
  redesk:
    build: .
    image: redesk:latest
    container_name: redesk
    restart: unless-stopped
    ports:
      - '8787:8787'
    volumes:
      - redesk-data:/data
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8787
      - DATABASE_URL=/data/redesk.db
      - STORAGE_DIR=/data/storage
      - SESSION_SECRET=${SESSION_SECRET:?请在环境变量或 .env 中设置强随机 SESSION_SECRET}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redesk-data:
