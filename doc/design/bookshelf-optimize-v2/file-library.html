<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书库文件 - 优化方案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f5;
      --fg: #141413;
      --card: #ffffff;
      --card-border: #e0ddd4;
      --muted: #6e6d68;
      --muted-light: #b0aea5;
      --primary: #d97757;
      --primary-soft: rgba(217, 119, 87, 0.08);
      --radius: 0.75rem;
      --font-sans: 'Poppins', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Newsreader', Georgia, ui-serif, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      min-height: 100vh;
      color: var(--fg);
    }

    /* 顶部栏 */
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--card-border);
      background: var(--card);
      position: sticky; top: 0; z-index: 10;
    }
    .back-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: none; background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      transition: background 0.12s;
    }
    .back-btn:hover { background: rgba(0,0,0,0.04); }
    .topbar h1 {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 500;
      flex: 1;
    }
    .btn-sm {
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 13px; font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      border: none;
      display: flex; align-items: center; gap: 5px;
      transition: all 0.12s;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--fg);
    }
    .btn-outline:hover { background: rgba(0,0,0,0.03); }

    /* 主内容 */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 28px;
    }

    /* 筛选器 */
    .filters {
      display: flex; flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-group {
      display: flex; gap: 4px;
    }
    .pill {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      font-size: 12px; font-weight: 500;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s;
    }
    .pill:hover { border-color: var(--muted-light); color: var(--fg); }
    .pill.on {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }
    .filter-divider {
      width: 1px; height: 20px;
      background: var(--card-border);
      margin: 0 4px;
    }

    /* 表格 */
    .file-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13.5px;
    }
    .file-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 12px; font-weight: 500;
      color: var(--muted);
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }
    .file-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(224,221,212,0.5);
      vertical-align: middle;
    }
    .file-table tr:hover td {
      background: rgba(0,0,0,0.015);
    }

    .file-name {
      display: flex; align-items: center; gap: 10px;
    }
    .file-icon {
      width: 32px; height: 32px;
      border-radius: 6px;
      background: var(--primary-soft);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .file-name-text {
      font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 240px;
    }
    .file-format {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      font-size: 11px; font-weight: 500;
      color: var(--muted);
      background: var(--bg);
    }
    .file-size, .file-date {
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
    }
    .file-link {
      font-size: 12.5px;
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
    }
    .file-link:hover { text-decoration: underline; }
    .file-unlinked {
      font-size: 12.5px;
      color: var(--muted-light);
    }

    .file-actions {
      display: flex; gap: 4px;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .file-table tr:hover .file-actions { opacity: 1; }
    .file-actions button {
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 12px; font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      border: none;
      display: flex; align-items: center; gap: 4px;
      transition: all 0.12s;
    }
    .btn-match {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--fg);
    }
    .btn-match:hover { background: rgba(0,0,0,0.03); }
    .btn-del {
      width: 28px; padding: 0;
      justify-content: center;
      background: transparent;
      color: #d64545;
    }
    .btn-del:hover { background: rgba(214,69,69,0.06); }

    /* 分页 */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .page-btns {
      display: flex; gap: 4px;
    }
    .page-btns button {
      width: 32px; height: 32px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: transparent;
      font-size: 13px;
      font-family: var(--font-sans);
      color: var(--fg);
      cursor: pointer;
      transition: all 0.12s;
    }
    .page-btns button:hover { background: rgba(0,0,0,0.03); }
    .page-btns button.on {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>

<header class="topbar">
  <button class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m15 18-6-6 6-6"/>
    </svg>
  </button>
  <h1>书库文件</h1>
  <button class="btn-sm btn-outline">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
    </svg>
    上传未关联文件
  </button>
</header>

<div class="container">

  <!-- 筛选器 -->
  <div class="filters">
    <div class="filter-group">
      <span class="pill on">全部格式</span>
      <span class="pill">EPUB</span>
      <span class="pill">PDF</span>
      <span class="pill">MOBI</span>
      <span class="pill">TXT</span>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group">
      <span class="pill on">全部</span>
      <span class="pill">已关联</span>
      <span class="pill">未关联</span>
    </div>
  </div>

  <!-- 文件列表 -->
  <table class="file-table">
    <thead>
      <tr>
        <th>文件名</th>
        <th>格式</th>
        <th>大小</th>
        <th>关联书籍</th>
        <th>上传时间</th>
        <th style="text-align:right;">操作</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <div class="file-name">
            <div class="file-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <span class="file-name-text">悉达多.epub</span>
          </div>
        </td>
        <td><span class="file-format">EPUB</span></td>
        <td class="file-size">2.4 MB</td>
        <td><span class="file-link">悉达多</span></td>
        <td class="file-date">2024-03-15</td>
        <td>
          <div class="file-actions">
            <button class="btn-del">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="file-name">
            <div class="file-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <span class="file-name-text">百年孤独.pdf</span>
          </div>
        </td>
        <td><span class="file-format">PDF</span></td>
        <td class="file-size">5.1 MB</td>
        <td><span class="file-unlinked">未关联</span></td>
        <td class="file-date">2024-06-20</td>
        <td>
          <div class="file-actions">
            <button class="btn-match">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
              匹配
            </button>
            <button class="btn-del">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="file-name">
            <div class="file-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <span class="file-name-text">设计模式.mobi</span>
          </div>
        </td>
        <td><span class="file-format">MOBI</span></td>
        <td class="file-size">1.8 MB</td>
        <td><span class="file-link">设计模式</span></td>
        <td class="file-date">2024-05-02</td>
        <td>
          <div class="file-actions">
            <button class="btn-del">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- 分页 -->
  <div class="pagination">
    <span>共 3 个文件</span>
    <div class="page-btns">
      <button class="on">1</button>
    </div>
  </div>

</div>

</body>
</html>
